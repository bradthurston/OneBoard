; OneBoard — CYD family build configs.
;
; Each env is a physical CYD board. The common display wiring (ILI9341 on
; HSPI pins 12/13/14/15/2) is shared by the whole 2432S0xx family; what
; differs between boards is the backlight pin and the touch topology.
; See VARIANTS.md for the full pin table, sources, and verification status.
;
; Verified on hardware: esp32-2432s028 (the bench board). The others are
; built from vendor/community schematics and need a test flash on real
; hardware before you trust them.

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DUSER_SETUP_LOADED
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DARDUINOJSON_DEFAULT_NESTING_LIMIT=64
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6

; ---- ESP32-2432S028R — the bench board. HARDWARE VERIFIED. ----
; 2.8" ILI9341 240x320, display on HSPI (MISO12 MOSI13 SCLK14 CS15 DC2 RST-1
; BL21). Touch = XPT2046 on a SEPARATE VSPI bus (CLK25 MOSI32 MISO39 CS33
; IRQ36). Requires USE_HSPI_PORT so display owns HSPI and touch owns VSPI.
[env:esp32-2432s028]
extends = common
build_flags =
    ${common.build_flags}
    -DILI9341_2_DRIVER
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DUSE_HSPI_PORT
    -DTOUCH_SHARED_BUS=0
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36
    -DTOUCH_SCLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39

; ---- ESP32-2432S024 — 2.4" (GUITION etc). NOT hardware-verified here. ----
; Same ILI9341 + same HSPI display pins as the S028, BUT:
;   backlight = 27 (not 21), touch = XPT2046 on the SHARED display SPI bus
;   (CS 33 on the same MISO/MOSI/SCLK as the TFT — no separate VSPI).
; Sources: vendor (NoosaHydro) User_Setup.h + marauder User_Setup_cyd_guition.h
[env:esp32-2432s024]
extends = common
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DUSE_HSPI_PORT
    -DTOUCH_SHARED_BUS=1
    -DTOUCH_CS=33

; ---- ESP32-2432S032 — 3.2". NOT hardware-verified here. ----
; This board ships with EITHER an ILI9341 or an ST7789 panel (check the IC
; under the LCD ribbon, or try both envs — one will light up). Common wiring
; is the same HSPI display bus. ST7789 usually needs the BGR + inversion
; flags below. Touch is XPT2046 on the shared display bus (CS 33).
; Sources: vendor (kpeeem) PDQgraphicstest + community.
[env:esp32-2432s032-ili9341]
extends = common
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DUSE_HSPI_PORT
    -DTOUCH_SHARED_BUS=1
    -DTOUCH_CS=33

[env:esp32-2432s032-st7789]
extends = common
build_flags =
    ${common.build_flags}
    -DST7789_DRIVER
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DUSE_HSPI_PORT
    -DTOUCH_SHARED_BUS=1
    -DTOUCH_CS=33
